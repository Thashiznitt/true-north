version: '3.9'

services:
  node-app:
    build: .
    container_name: truenorth-api
    restart: always
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DIRECT_URL: ${DIRECT_URL}
      REDIS_URL: redis://:truenorth_redis_pwd@redis:6379
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: 3000
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    container_name: truenorth-redis
    restart: always
    command: redis-server --requirepass "truenorth_redis_pwd"
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
